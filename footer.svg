<svg width="1000" height="90" viewBox="0 0 1000 90" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <clipPath id="footer-clip">
      <rect x="0" y="0" width="1000" height="90" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#footer-clip)">
    <rect x="0" y="0" width="1000" height="90" fill="#0d1117"/>
    <circle cx="26" cy="18" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="18" r="6" fill="#27c93f"/>
    <line x1="0" y1="32" x2="1000" y2="32" stroke="#30363d" stroke-width="1"/>

    <text x="70" y="65" font-size="19">
      <tspan fill="#e0913f" font-weight="700">$</tspan>
      <tspan fill="#c9d1d9"> echo "thanks for stopping by — let's build something"</tspan>
    </text>
    <rect x="660" y="49" width="10" height="20" fill="#e0913f">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.45;0.9;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <rect x="0.5" y="0.5" width="999" height="89" rx="16" ry="16" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
