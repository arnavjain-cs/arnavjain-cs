<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <clipPath id="panel-clip">
      <rect x="0" y="0" width="1000" height="260" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel-clip)">
    <rect x="0" y="0" width="1000" height="260" fill="#0d1117"/>

    <!-- title bar -->
    <rect x="0" y="0" width="1000" height="42" fill="#161b22"/>
    <line x1="0" y1="42" x2="1000" y2="42" stroke="#30363d" stroke-width="1"/>

    <circle cx="26" cy="21" r="6" fill="#ff5f56"/>
    <circle cx="46" cy="21" r="6" fill="#ffbd2e"/>
    <circle cx="66" cy="21" r="6" fill="#27c93f"/>
    <text x="94" y="26" font-size="13" fill="#7d8590">whoami.sh</text>

    <!-- line-number gutter -->
    <text x="46" y="86"  font-size="13" fill="#484f58" text-anchor="end">1</text>
    <text x="46" y="144" font-size="13" fill="#484f58" text-anchor="end">2</text>
    <text x="46" y="195" font-size="13" fill="#484f58" text-anchor="end">3</text>
    <text x="46" y="230" font-size="13" fill="#484f58" text-anchor="end">4</text>

    <!-- line 1: command -->
    <text x="70" y="86" font-size="19">
      <tspan fill="#e0913f" font-weight="700">$</tspan>
      <tspan fill="#c9d1d9"> whoami</tspan>
    </text>

    <!-- line 2: name -->
    <text x="70" y="150" font-size="44" font-weight="700" fill="#e6edf3" letter-spacing="0.5">Arnav Jain</text>
    <rect x="71" y="163" width="308" height="4" rx="2" fill="#e0913f"/>

    <!-- line 3: tagline comment -->
    <text x="70" y="196" font-size="16" fill="#e0913f">
      <tspan># CS student · builder · thinker · student leader</tspan>
    </text>

    <!-- line 4: fresh prompt with blinking cursor -->
    <text x="70" y="230" font-size="19" fill="#e0913f" font-weight="700">$</text>
    <rect x="88" y="212" width="11" height="21" fill="#e0913f">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.45;0.9;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- outer border -->
  <rect x="0.5" y="0.5" width="999" height="259" rx="16" ry="16" fill="none" stroke="#30363d" stroke-width="1"/>
</svg>
